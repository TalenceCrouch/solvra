[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solvra"
version = "0.1.0"
description = "Backend-heavy payments operations CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
solvra = "solvra.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
